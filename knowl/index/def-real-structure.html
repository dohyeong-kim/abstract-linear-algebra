<article class="definition definition-like"><h4 class="heading">
<span class="type">정의</span><span class="space"> </span><span class="codenumber">4.2.9</span><span class="period">.</span><span class="space"> </span><span class="title">실수 구조.</span>
</h4>
<div class="para logical">
<div class="para">복소 벡터공간 <span class="process-math">\(W\)</span> 위에 존재하는 켤레선형 대합 <span class="process-math">\(S: W \to W\)</span>를 실수 구조라고 합니다. 즉, <span class="process-math">\(S\)</span>는 다음 조건을 만족하는 <span class="process-math">\(\mathbb{R}\)</span>-선형 변환입니다:</div>
<div class="displaymath process-math">
\begin{equation*}
S^2 = \mathrm{id}_W \quad \text{및} \quad S(\lambda w) = \bar{\lambda} S(w) \text{ for all } \lambda \in \mathbb{C}, w \in W.
\end{equation*}
</div>
